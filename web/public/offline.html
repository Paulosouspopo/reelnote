<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne — Reelnote</title>
    <style>
      :root { color-scheme: light dark; --bg: #edf0f4; --ink: #172033; --muted: #4f5a6e; --accent: #2d4bf0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1522; --ink: #e7ecf4; --muted: #a9b3c4; --accent: #7c93ff; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
      h1 { font-size: 24px; margin: 12px 0 6px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 44px">📡</div>
      <h1>Pas de connexion</h1>
      <p>Tes fiches reviennent dès que le réseau est de retour.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
