[project]
name = "reelnote-worker"
version = "0.1.0"
description = "Transforme des reels en fiches : téléchargement, transcription, analyse par Claude."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.60",
  "faster-whisper>=1.1",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pywebpush>=2.0",
  # Instagram change souvent : on reconstruit l'image régulièrement pour suivre yt-dlp.
  "yt-dlp[default]>=2025.10.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
reelnote-worker = "reelnote_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelnote_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = [
  "S603", # appels subprocess : arguments construits par nous, jamais via un shell
  "RUF001", "RUF002", "RUF003", # caractères français dans les chaînes et commentaires
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "faster_whisper.*", "pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true
